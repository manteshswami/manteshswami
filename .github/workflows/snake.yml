name: Generate Snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate dragon-themed snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: manteshswami
          outputs: |
            dist/github-snake.svg?color_snake=%23ff4d00,%23ff8800&color_dots=%23161b22,%232a0f00,%23662200,%23b34700,%23ff5500&color_background=%230d1117
            dist/github-snake-dark.svg?color_snake=%23ff4d00,%23ff8800&color_dots=%23161b22,%232a0f00,%23662200,%23b34700,%23ff5500&color_background=%230d1117
      - name: Push snake SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
